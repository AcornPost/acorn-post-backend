spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:acornpost}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:acorn-post}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: ${KAFKA_ACKS:all}
      retries: ${KAFKA_RETRIES:3}
      properties:
        max.in.flight.requests.per.connection: ${KAFKA_MAX_IN_FLIGHT:1}

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "yerong.acorn_post_backend"
        spring.json.value.default.type: "yerong.acorn_post_backend.manitto.realtime.kafka.ManittoChatEvent"
server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    yerong.acorn_post_backend: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG

jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-development-only-change-in-production-at-least-256-bits}
  access-token-validity: 86400000
  refresh-token-validity: 604800000

app:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    topic:
      manitto-chat: ${KAFKA_TOPIC_MANITTO_CHAT:manitto.chat.v1}
    group:
      manitto-chat: ${KAFKA_GROUP_ID_MANITTO_CHAT:acorn-post-manitto-chat}
